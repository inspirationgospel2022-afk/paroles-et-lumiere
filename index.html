<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paroles et Lumière</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #14233b;
    }
    header {
      background: #102b54;
      color: white;
      padding: 36px 20px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; }
    main { padding: 20px; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #00000012;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <h1>PAROLES ET LUMIÈRE</h1>
    <p>La Parole de Dieu pour éclairer nos vies</p>
  </header>

  <main>
    <div class="card">
      <h2>Bienvenue</h2>
      <p>Grandissez chaque jour dans la connaissance de la Parole de Dieu.</p>
    </div>

    <div class="card">
      <h2>Enseignements bibliques</h2>
      <p>Découvrez nos études et méditations bibliques.</p>
    </div>

    <div class="card">
      <h2>Audios et vidéos</h2>
      <p>Retrouvez prochainement nos messages spirituels.</p>
    </div>
  </main>

  <footer>Paroles et Lumière</footer>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js');
  });
}
  </script>
</body>
</html>
